<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>YT Downloader Pro</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #1a1a1a;
      --text: #eee;
      --accent: #ff0055;
      --accent2: #00c9ff;
      --input-bg: #2a2a2a;
      --border: #333;
      --shadow: 0 10px 30px rgba(0,0,0,0.5);
      --nav-height: 60px;
    }
    .light-mode {
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #222;
      --accent: #d63384;
      --accent2: #0d6efd;
      --input-bg: #fff;
      --border: #ddd;
      --shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      padding-bottom: calc(20px + var(--nav-height));
      transition: background 0.3s, color 0.3s;
    }
    .container {
      width: 100%;
      max-width: 850px;
      background: var(--card);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: background 0.3s;
    }
    .header {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      padding: 28px 20px;
      font-size: 32px;
      font-weight: 800;
      text-align: center;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .tabs {
      display: flex;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 18px 8px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      white-space: nowrap;
      font-size: 16px;
      background: transparent;
    }
    .tab.active {
      border-bottom-color: var(--accent);
      color: var(--accent);
      background: rgba(255,255,255,0.03);
    }
    .tab:hover { background: rgba(255,255,255,0.05); }
    .content { padding: 24px; }
    .flex-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    input, select, button, textarea {
      background: var(--input-bg);
      border: 2px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,0,85,0.2); }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.1s, box-shadow 0.2s, opacity 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,0,85,0.3); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.6; transform: none; box-shadow: none; cursor: not-allowed; }
    .hidden { display: none !important; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .thumb-img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .thumb-img:hover { transform: scale(1.02); }
    .poster-card {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: #111;
      margin-bottom: 16px;
    }
    .poster-card .blur-bg {
      filter: blur(25px);
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0.6;
      transform: scale(1.1);
    }
    .poster-card .inner {
      position: relative;
      z-index: 1;
      padding: 30px;
      text-align: center;
    }
    .poster-card img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .progress-bar {
      height: 8px;
      background: #333;
      border-radius: 6px;
      margin: 12px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.3s;
      border-radius: 6px;
    }
    .video-player {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .video-player iframe { width: 100%; height: 100%; border: none; }
    .theme-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--accent);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1000;
      font-size: 22px;
      box-shadow: 0 5px 20px rgba(255,0,85,0.4);
      transition: transform 0.2s;
    }
    .theme-btn:hover { transform: scale(1.1); }

    @media (max-width: 768px) {
      .tabs {
        position: fixed;
        bottom: 0;
        left: 0; right: 0;
        background: var(--card);
        border-top: 2px solid var(--border);
        z-index: 999;
      }
      .tab { font-size: 13px; padding: 14px 4px; border-bottom: none; border-top: 3px solid transparent; }
      .tab.active { border-top-color: var(--accent); }
    }

    /* Toast notifications */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--card);
      color: var(--text);
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      animation: slideIn 0.3s ease;
      border-left: 4px solid var(--accent);
    }
    .toast.error { border-left-color: #dc3545; }
    .toast.success { border-left-color: #28a745; }
    @keyframes slideIn {
      from { transform: translateX(100px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top: 2px solid #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">
  <div class="header">⬇️ YT Downloader Pro</div>
  <div class="tabs">
    <div class="tab active" data-tab="video">🎥 Video</div>
    <div class="tab" data-tab="audio">🎵 Music</div>
    <div class="tab" data-tab="playlist">📀 Playlist</div>
  </div>
  <div class="content">
    <div id="dropZone" style="border:2px dashed var(--border); padding:20px; text-align:center; border-radius:16px; margin-bottom:20px; transition: 0.2s;">📥 Drag & drop a YouTube link here</div>
    <div class="flex-row">
      <input type="text" id="urlInput" placeholder="Paste YouTube link here...">
      <button id="clipboardBtn">📋</button>
      <button id="fetchBtn">🔍 Fetch</button>
    </div>
    <div id="nonYoutubeWarn" class="hidden" style="color:#f0ad4e; margin-top:5px;">⚠️ Non‑YouTube URL – support may vary.</div>

    <div class="flex-row">
      <input type="text" id="customFilename" placeholder="Custom filename (optional)" style="flex:1;">
      <span id="batchModeBtn" style="background:var(--input-bg); padding:10px 20px; border-radius:25px; cursor:pointer; font-weight:600;">📦 Batch</span>
    </div>
    <textarea id="batchUrls" class="hidden" placeholder="Multiple links (one per line)" style="width:100%; height:90px; margin-bottom:12px;"></textarea>

    <div class="flex-row">
      <input type="datetime-local" id="scheduleTime" style="flex:1;">
      <button id="scheduleBtn">⏰ Schedule</button>
    </div>

    <!-- Preview card -->
    <div id="preview" class="hidden card">
      <!-- Video -->
      <div id="videoPreview" class="hidden">
        <div id="videoPlayerContainer" class="video-player hidden"></div>
        <img id="videoThumb" class="thumb-img">
        <h3 id="videoTitle" style="margin-bottom:10px;"></h3>
        <div class="flex-row">
          <select id="formatSelect"><option value="mp4">MP4</option><option value="mkv">MKV</option><option value="webm">WebM</option></select>
          <select id="qualitySelect"><option value="best">Best</option><option value="1080p">1080p</option><option value="720p">720p</option><option value="360p">360p</option></select>
          <span id="fileSizeEstimate" style="font-size:14px;"></span>
        </div>
        <div class="flex-row">
          <input type="text" id="trimStart" placeholder="Start (hh:mm:ss)">
          <input type="text" id="trimEnd" placeholder="End (hh:mm:ss)">
        </div>
        <div class="flex-row" style="flex-wrap:wrap;">
          <label style="display:flex; align-items:center; gap:5px;"><input type="checkbox" id="subtitles"> Subs</label>
          <label>Speed(KB/s): <input type="number" id="speedLimit" value="0" min="0" style="width:80px;"></label>
          <select id="convertTo"><option value="">No convert</option><option value="mp4">MP4</option><option value="mkv">MKV</option><option value="webm">WebM</option><option value="mp3">MP3</option></select>
        </div>
        <button id="downloadVideoBtn" style="margin-top:12px;"><span>⬇️ Download Video</span></button>
      </div>

      <!-- Music -->
      <div id="musicPreview" class="hidden poster-card">
        <div class="blur-bg" id="musicBlurBg"></div>
        <div class="inner">
          <img id="musicThumb">
          <h3 id="musicTitle"></h3>
          <p id="musicDuration" style="color:#aaa;"></p>
          <select id="audioFormatSelect" style="margin:10px 0;"><option value="mp3">MP3 192kbps</option><option value="mp3_320">MP3 320kbps</option><option value="m4a">M4A</option></select>
          <button id="downloadMusicBtn">🎵 Download MP3</button>
        </div>
      </div>

      <!-- Playlist -->
      <div id="playlistPreview" class="hidden">
        <h3 id="plTitle"></h3><p id="plCount"></p>
        <div class="flex-row"><label><input type="checkbox" id="selectAllCheckbox"> Select All</label><span id="selectionInfo">0 selected</span></div>
        <div id="plItems" style="max-height:220px; overflow-y:auto; margin:10px 0;"></div>
        <div class="flex-row"><button id="dlPlaylistVideo">🎥 Download Videos</button><button id="dlPlaylistAudio">🎵 Download Audio</button></div>
      </div>
    </div>

    <!-- Queue & Progress -->
    <div id="queueArea" class="hidden card"></div>
    <div id="progressArea" class="hidden card">
      <canvas id="speedGraph" class="hidden" style="width:100%; height:60px; background:#111; border-radius:10px;"></canvas>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div id="statusText" style="margin:8px 0;"></div>
      <a id="fileLink" class="hidden" href="#" style="display:block; color:var(--accent); margin-bottom:8px;">⬇️ Download ready</a>
      <div id="subtitleLinks" class="hidden"></div>
      <button id="playBtn" class="hidden" style="margin-right:10px;">▶ Play</button>
      <button id="copyLinkBtn" class="hidden">📋 Copy link</button>
    </div>

    <!-- History -->
    <div id="historyArea" style="margin-top:24px;">
      <h3 style="margin-bottom:10px;">📜 Recent Downloads <button id="exportCsvBtn" style="font-size:13px; padding:8px 14px;">Export CSV</button></h3>
      <div id="historyList"></div>
    </div>
  </div>
</div>

<div class="theme-btn" onclick="toggleTheme()">🌓</div>

<script>
  // ----- globals -----
  const HISTORY_KEY = 'ytDownloadHistory';
  let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
  function saveHistory(item) { history.unshift({...item, date:new Date().toLocaleString()}); if(history.length>50) history.pop(); localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); renderHistory(); }
  function renderHistory() {
    const list = document.getElementById('historyList');
    if(!history.length) { list.innerHTML='<p style="color:#888;">No downloads yet.</p>'; return; }
    list.innerHTML = history.map(h=>`<div style="padding:8px; border-bottom:1px solid var(--border);"><strong>${h.title}</strong><br><small>${h.date} · ${h.type} · <a href="${h.url}" target="_blank" style="color:var(--accent);">Source</a></small></div>`).join('');
  }
  renderHistory();

  // theme
  const storedTheme = localStorage.getItem('theme')||'dark';
  if(storedTheme==='light') document.body.classList.add('light-mode');
  function toggleTheme() { document.body.classList.toggle('light-mode'); localStorage.setItem('theme', document.body.classList.contains('light-mode')?'light':'dark'); }

  // toast system
  function showToast(msg, type='info') {
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  // button loading helper
  function setLoading(btn, loading, originalText) {
    if (loading) {
      btn.disabled = true;
      btn.dataset.originalText = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span> Loading...';
    } else {
      btn.disabled = false;
      btn.innerHTML = btn.dataset.originalText || originalText;
    }
  }

  // tabs
  const tabs = document.querySelectorAll('.tab');
  let currentTab = 'video';
  tabs.forEach(t => t.addEventListener('click', function(){
    tabs.forEach(tab=>tab.classList.remove('active')); this.classList.add('active');
    currentTab = this.dataset.tab;
    resetPreviews();
  }));

  // DOM refs
  const urlInput = document.getElementById('urlInput');
  const fetchBtn = document.getElementById('fetchBtn');
  const previewDiv = document.getElementById('preview');
  const videoPreview = document.getElementById('videoPreview');
  const musicPreview = document.getElementById('musicPreview');
  const playlistPreview = document.getElementById('playlistPreview');
  const progressArea = document.getElementById('progressArea');
  const progressFill = document.getElementById('progressFill');
  const statusText = document.getElementById('statusText');
  const fileLink = document.getElementById('fileLink');
  const copyLinkBtn = document.getElementById('copyLinkBtn');
  const playBtn = document.getElementById('playBtn');
  const videoPlayerContainer = document.getElementById('videoPlayerContainer');
  const videoThumb = document.getElementById('videoThumb');
  const nonYoutubeWarn = document.getElementById('nonYoutubeWarn');
  const fileSizeEstimate = document.getElementById('fileSizeEstimate');
  const speedCanvas = document.getElementById('speedGraph');
  const ctx = speedCanvas.getContext('2d');
  let currentVideoId = null, playlistEntries = [], currentDownloadId = null, pollInterval = null;

  // auto detect playlist (1s after typing)
  let autoTimer;
  urlInput.addEventListener('input', ()=>{
    clearTimeout(autoTimer);
    autoTimer = setTimeout(async ()=>{
      const url = urlInput.value.trim();
      if(!url) return;
      try {
        const res = await fetch('/api/info', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url})});
        const data = await res.json();
        if(data.type==='playlist') {
          tabs.forEach(t=>t.classList.remove('active'));
          document.querySelector('.tab[data-tab="playlist"]').classList.add('active');
          currentTab='playlist';
          resetPreviews();
          fetchBtn.click();
        }
      }catch(e){}
    }, 1000);
  });

  // drag & drop
  const dropZone = document.getElementById('dropZone');
  dropZone.addEventListener('dragover', e=>{ e.preventDefault(); dropZone.style.borderColor='var(--accent)'; });
  dropZone.addEventListener('dragleave', ()=> dropZone.style.borderColor='var(--border)');
  dropZone.addEventListener('drop', e=>{
    e.preventDefault(); dropZone.style.borderColor='var(--border)';
    const text = e.dataTransfer.getData('text/plain');
    if(text) { urlInput.value=text; fetchBtn.click(); }
  });

  // clipboard
  document.getElementById('clipboardBtn').addEventListener('click', async ()=>{
    const text = await navigator.clipboard.readText().catch(()=>null);
    if(text && (text.includes('youtube.com')||text.includes('youtu.be'))) { urlInput.value=text; fetchBtn.click(); showToast('Link pasted from clipboard!', 'success'); }
    else showToast('No YouTube link found.', 'error');
  });

  // batch toggle
  document.getElementById('batchModeBtn').addEventListener('click', ()=> document.getElementById('batchUrls').classList.toggle('hidden'));

  // fetch info
  fetchBtn.addEventListener('click', async ()=>{
    const url = urlInput.value.trim();
    if(!url) return showToast('Please enter a URL', 'error');
    setLoading(fetchBtn, true);
    resetPreviews();
    try {
      const res = await fetch('/api/info', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url})});
      const data = await res.json();
      setLoading(fetchBtn, false, '🔍 Fetch');
      if(data.error) { showToast(data.error, 'error'); return; }
      previewDiv.classList.remove('hidden');
      nonYoutubeWarn.classList.toggle('hidden', data.is_youtube!==false);
      if(data.type==='playlist') {
        playlistEntries = data.entries;
        buildPlaylistUI(playlistEntries);
        document.getElementById('plTitle').textContent = data.title;
        document.getElementById('plCount').textContent = `${data.video_count} videos`;
        playlistPreview.classList.remove('hidden');
      } else {
        if(currentTab==='audio') {
          musicPreview.classList.remove('hidden');
          document.getElementById('musicTitle').textContent = data.title;
          document.getElementById('musicThumb').src = data.thumbnail;
          document.getElementById('musicDuration').textContent = data.duration ? `${Math.floor(data.duration/60)}:${String(data.duration%60).padStart(2,'0')}` : '';
          document.getElementById('musicBlurBg').style.backgroundImage = `url(${data.thumbnail})`;
        } else {
          videoPreview.classList.remove('hidden');
          document.getElementById('videoTitle').textContent = data.title;
          videoThumb.src = data.thumbnail;
          videoThumb.classList.remove('hidden');
          videoPlayerContainer.classList.add('hidden');
          currentVideoId = data.video_id;
          videoThumb.onclick = ()=>{
            if(currentVideoId) {
              videoPlayerContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${currentVideoId}" allowfullscreen></iframe>`;
              videoPlayerContainer.classList.remove('hidden');
              videoThumb.classList.add('hidden');
            }
          };
          updateFileSizeEstimate(data.formats);
        }
        showToast('Video info loaded', 'success');
      }
    } catch(e) { setLoading(fetchBtn, false, '🔍 Fetch'); showToast('Network error', 'error'); }
  });

  function updateFileSizeEstimate(formats) {
    const qualitySelect = document.getElementById('qualitySelect');
    const estimateSpan = document.getElementById('fileSizeEstimate');
    function recalc() {
      const chosen = qualitySelect.value;
      const fmt = formats.find(f=>f.resolution===chosen || (chosen==='best' && f.resolution==='2160p'));
      estimateSpan.textContent = fmt && fmt.filesize ? `~${(fmt.filesize/1048576).toFixed(1)} MB` : '';
    }
    qualitySelect.addEventListener('change', recalc);
    recalc();
  }

  function buildPlaylistUI(entries) {
    const container = document.getElementById('plItems');
    container.innerHTML = entries.map((e,i)=>`
      <div class="flex-row" style="margin-bottom:6px; align-items:center;">
        <input type="checkbox" class="video-checkbox" data-index="${i}" onchange="updateSelectionInfo()">
        <img src="${e.thumbnail||''}" style="width:60px;height:45px;object-fit:cover;border-radius:6px;" onerror="this.style.display='none'">
        <span style="flex:1;">${e.title}</span>
      </div>`).join('');
    updateSelectionInfo();
  }
  document.getElementById('selectAllCheckbox').addEventListener('change', function(){
    document.querySelectorAll('.video-checkbox').forEach(cb=>cb.checked=this.checked);
    updateSelectionInfo();
  });
  function updateSelectionInfo() {
    const count = document.querySelectorAll('.video-checkbox:checked').length;
    document.getElementById('selectionInfo').textContent = `${count} selected`;
  }
  function getSelectedIndexes() {
    return Array.from(document.querySelectorAll('.video-checkbox:checked')).map(cb=>parseInt(cb.dataset.index));
  }

  function resetPreviews() {
    previewDiv.classList.add('hidden');
    videoPreview.classList.add('hidden');
    musicPreview.classList.add('hidden');
    playlistPreview.classList.add('hidden');
    progressArea.classList.add('hidden');
    document.getElementById('queueArea').classList.add('hidden');
    nonYoutubeWarn.classList.add('hidden');
    videoPlayerContainer.classList.add('hidden');
    videoThumb.classList.remove('hidden');
  }

  // download triggers
  document.getElementById('downloadVideoBtn').addEventListener('click', ()=>startDownload('video'));
  document.getElementById('downloadMusicBtn').addEventListener('click', ()=>startDownload('audio'));
  document.getElementById('dlPlaylistVideo').addEventListener('click', ()=>startDownload('playlist_video'));
  document.getElementById('dlPlaylistAudio').addEventListener('click', ()=>startDownload('playlist_audio'));

  async function startDownload(type) {
    const url = urlInput.value.trim();
    if(!url) return showToast('No URL', 'error');
    let quality = 'best';
    if(type==='video'||type==='playlist_video') quality = document.getElementById('qualitySelect').value;
    const trimStart = document.getElementById('trimStart').value || null;
    const trimEnd = document.getElementById('trimEnd').value || null;
    const playlist = type.startsWith('playlist');
    const formatExt = document.getElementById('formatSelect').value;
    const audioFormat = document.getElementById('audioFormatSelect')?.value || 'mp3';
    const speedLimit = parseInt(document.getElementById('speedLimit').value) || null;
    const subtitles = document.getElementById('subtitles')?.checked || false;
    const convertTo = document.getElementById('convertTo').value || null;
    const customFilename = document.getElementById('customFilename').value || null;
    let selectedIndexes = null;
    if(playlist) {
      selectedIndexes = getSelectedIndexes();
      if(!selectedIndexes.length) return showToast('Select at least one video', 'error');
    }
    const batchArea = document.getElementById('batchUrls');
    let batchUrls = null;
    if(!batchArea.classList.contains('hidden')) {
      batchUrls = batchArea.value.split('\n').filter(u=>u.trim());
      if(!batchUrls.length) return showToast('Enter batch URLs', 'error');
    }
    const scheduledTime = document.getElementById('scheduleTime').value || null;

    const payload = {
      url, type, quality,
      trim_start:trimStart, trim_end:trimEnd,
      playlist, format_ext:formatExt, audio_format:audioFormat,
      selected_indexes:selectedIndexes,
      speed_limit:speedLimit, subtitles, convert_to:convertTo,
      batch_urls:batchUrls, custom_filename:customFilename,
      scheduled_time:scheduledTime
    };

    // disable download button
    const btn = type==='audio' ? document.getElementById('downloadMusicBtn') : document.getElementById('downloadVideoBtn');
    setLoading(btn, true);

    progressArea.classList.remove('hidden');
    progressFill.style.width='0%';
    statusText.textContent = scheduledTime ? 'Scheduled...' : 'Starting...';
    fileLink.classList.add('hidden');
    copyLinkBtn.classList.add('hidden');
    playBtn.classList.add('hidden');
    document.getElementById('subtitleLinks').classList.add('hidden');
    document.getElementById('queueArea').classList.add('hidden');
    speedCanvas.classList.add('hidden');

    try {
      const res = await fetch('/api/download', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      const data = await res.json();
      setLoading(btn, false, type==='audio' ? '🎵 Download MP3' : '⬇️ Download Video');
      if(data.scheduled) { statusText.textContent = `Scheduled for ${new Date(scheduledTime).toLocaleString()}`; showToast('Download scheduled', 'info'); return; }
      currentDownloadId = data.download_id;
      startPolling(currentDownloadId);
    } catch(e) { setLoading(btn, false); showToast('Error starting download', 'error'); }
  }

  function startPolling(did) {
    if(pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(async ()=>{
      const res = await fetch(`/api/progress/${did}`);
      if(res.status===404) { statusText.textContent='Status not found'; clearInterval(pollInterval); return; }
      const d = await res.json();
      if(d.status==='done') {
        progressFill.style.width='100%';
        statusText.textContent='Download complete!';
        fileLink.href=`/file/${did}/${d.filename}`;
        fileLink.textContent=`⬇️ ${d.filename}`;
        fileLink.classList.remove('hidden');
        copyLinkBtn.classList.remove('hidden');
        playBtn.classList.remove('hidden');
        playBtn.onclick = ()=>window.open(fileLink.href);
        if(d.subtitles && d.subtitles.length) {
          const subDiv = document.getElementById('subtitleLinks');
          subDiv.innerHTML = '<br>Subtitles: ' + d.subtitles.map(s=>`<a href="/file/${did}/${s}" style="color:var(--accent);">${s}</a>`).join(', ');
          subDiv.classList.remove('hidden');
        }
        saveHistory({ title:d.title||'Unknown', url:urlInput.value, type:currentTab });
        clearInterval(pollInterval);
        showToast('Download finished!', 'success');
        // beep
        try { const a=new AudioContext(); const o=a.createOscillator(); o.frequency.value=800; o.connect(a.destination); o.start(); setTimeout(()=>o.stop(),200); } catch(e){}
      } else if(d.status==='error') {
        statusText.textContent='Error: '+d.message; clearInterval(pollInterval); showToast('Download error: '+d.message, 'error');
      } else {
        progressFill.style.width = d.percent+'%';
        statusText.textContent = `${d.percent||0}% · ${d.speed||0} MB/s · ETA ${d.eta||'...'}`;
        if(d.queue_items) {
          const qa = document.getElementById('queueArea');
          qa.classList.remove('hidden');
          qa.innerHTML = d.queue_items.map((it,i)=>`<div class="flex-row" style="align-items:center;gap:8px;"><span>${it.url.substring(0,40)}</span><div style="flex:1;height:4px;background:#333;"><div style="width:${it.percent||0}%;height:100%;background:var(--accent);"></div></div></div>`).join('');
        }
        if(d.speed_history && d.speed_history.length>1) {
          speedCanvas.classList.remove('hidden');
          drawSpeedGraph(d.speed_history);
        }
      }
    }, 1000);
  }

  function drawSpeedGraph(speeds) {
    const w = speedCanvas.width = speedCanvas.clientWidth;
    const h = speedCanvas.height = speedCanvas.clientHeight;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle='var(--accent)'; ctx.lineWidth=2; ctx.beginPath();
    const max = Math.max(...speeds, 0.1);
    speeds.forEach((v,i)=>{
      const x = (i/(speeds.length-1))*w;
      const y = h - (v/max)*(h-4)-2;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
  }

  // copy link
  document.getElementById('copyLinkBtn').addEventListener('click', ()=> {
    navigator.clipboard.writeText(fileLink.href).then(()=> showToast('Link copied!', 'success'));
  });

  // export CSV
  document.getElementById('exportCsvBtn').addEventListener('click', ()=>{
    const rows = [['Title','Date','Type','URL']];
    history.forEach(h=>rows.push([h.title,h.date,h.type,h.url]));
    const csv = rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
    const blob = new Blob([csv],{type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'download_history.csv';
    a.click();
    showToast('History exported!', 'success');
  });

  // Ctrl+Enter shortcut
  document.addEventListener('keydown', e=>{
    if(e.ctrlKey && e.key==='Enter') {
      e.preventDefault();
      if(currentTab==='video') document.getElementById('downloadVideoBtn').click();
      else if(currentTab==='audio') document.getElementById('downloadMusicBtn').click();
    }
  });
</script>
</body>
</html>
